name: test

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  format-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set base image
        run: |
          ./scripts/base_image >> $GITHUB_ENV

      # The base image (terrat-base) ships dune + ocamlformat, pinned to the
      # exact versions the project uses, so formatting here is byte-identical
      # to a developer's `dune fmt`. To fix locally, run `dune build @fmt --auto-promote` from the repo root
      - name: Check formatting
        run: |
          if ! docker run --rm -v "$PWD:/mono" -w /mono "$BASE_IMAGE" \
               bash -c 'eval $(opam env) && dune build @fmt'
          then
            echo "::error::Formatting check failed. From the repo root, run 'dune build @fmt --auto-promote' to format all OCaml and dune files, then commit the result."
            exit 1
          fi

  # NOTE: this job must always RUN, never be skipped with a job-level `if:`.
  # A matrix job skipped by `if:` is not expanded — GitHub reports a single
  # check named "build-test" instead of the six "build-test (target, arch)"
  # contexts the ruleset requires, which leaves the PR blocked just as the old
  # `paths-ignore` did. So the job runs and each step opts out instead; the
  # six checks are reported and pass in seconds for docs-only changes.
  #
  # The image is built on a Depot builder of its platform, not on the runner, so
  # both arches run on the same (amd64) runner.
  build-test:
    needs: changes
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target:
          - terrat-ee
          - terrat-oss
          - ttm
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        if: needs.changes.outputs.code == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date tag
        if: needs.changes.outputs.code == 'true'
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Extract branch name and commit
        if: needs.changes.outputs.code == 'true'
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH_NAME=$(printf '%s' "$HEAD_REF" | sed 's/[^a-zA-Z0-9._-]/-/g')
          else
            BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          echo "branch=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Depot CLI
        if: needs.changes.outputs.code == 'true'
        uses: depot/setup-action@v1

      # Built from docker/stategraph/Dockerfile, the source of truth for the terrat images,
      # on Depot's builders, in the repository's own Depot project.
      # The Dockerfile builds its own opam switch, and
      # the builders keep the layer cache and its dune cache mount between runs, so
      # no prebuilt base image is needed. Build args as in stategraph.yml; GIT_SHA
      # stamps the terrat binaries. provenance: false keeps the image a plain
      # manifest, as before.
      - name: Build and push ${{ matrix.target }}
        if: needs.changes.outputs.code == 'true'
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          provenance: false
          context: .
          file: docker/stategraph/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            UID=1000
            GID=1000
            USERNAME=stategraph
            DEPLOYMENT_KIND=production
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.target }}-dev:${{ steps.date.outputs.date }}-${{ steps.branch.outputs.branch }}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
