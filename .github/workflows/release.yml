name: release

on:
  push:
    branches:
      - main
    # A semver tag marks the commit that holds a Stategraph release. It builds
    # stategraph-server-oss with that version, and nothing else.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
      - 'rfds/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  # Gate for the whole pipeline. Every push to main cuts a release, and a release that carries
  # nothing user-facing is just noise in the feed people subscribe to. When every PR since the
  # last release is labelled `no-release`, this job stops here.
  release-gate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read

    outputs:
      release: ${{ steps.release-gate.outputs.release }}

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags: the gate walks main back to the previous release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to release
        id: release-gate
        run: |
          ./scripts/release_gate

  set-version-tag:
    needs: release-gate
    if: needs.release-gate.outputs.release == 'true'
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: write

    outputs:
      version_tag: ${{ steps.set-version-tag.outputs.version_tag }}

    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version tag
        id: set-version-tag
        run: |
          VERSION_TAG=$(./scripts/version_tag)
          echo "VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"
          echo "version_tag=${VERSION_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create tag
        run: |
          ./scripts/create_tag

  build:
    needs: set-version-tag
    runs-on: ${{ matrix.runs-on }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    strategy:
      matrix:
        target: [terrat-ee, terrat-oss, ttm]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
          - arch: arm64
            runs-on: ubuntu-22.04-arm

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERRAT_UI_ANALYTICS: ${{ github.event.inputs.environment == 'production' && vars.TERRATEAM_POSTHOG_TOKEN || 'false' }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      MATRIX_TARGET: ${{ matrix.target }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Set base image
        run: |
          ./scripts/base_image >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.target }} (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/terrat/Dockerfile
          push: true
          target: ${{ matrix.target }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/terrateamio/${{ matrix.target }}:${{ env.VERSION_TAG }}-${{ matrix.arch }}

      - name: Verify the shipped binary was built from this commit
        if: matrix.target == 'terrat-oss' || matrix.target == 'terrat-ee'
        env:
          IMAGE: ghcr.io/terrateamio/${{ matrix.target }}:${{ env.VERSION_TAG }}-${{ matrix.arch }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c "strings /usr/local/bin/terrat | grep -qF \"$BUILD_SHA\"" \
            || { echo "Binary does not contain the release SHA: stale or hybrid build"; exit 1; }

      - name: Extract ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        run: |
          docker create --name ttm-extract ghcr.io/terrateamio/ttm:${{ env.VERSION_TAG }}-${{ matrix.arch }}
          docker cp ttm-extract:/usr/local/bin/ttm ./ttm-linux-${{ matrix.arch }}
          docker rm ttm-extract
          chmod +x ./ttm-linux-${{ matrix.arch }}

      - name: Verify ttm binary is statically linked (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        run: |
          if ! file ./ttm-linux-${{ matrix.arch }} | grep -q 'statically linked'; then
              echo "ERROR: ./ttm-linux-${{ matrix.arch }} is not statically linked:" >&2
              file ./ttm-linux-${{ matrix.arch }} >&2
              exit 1
          fi

      - name: Smoke-test ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        # Runner arch matches matrix.arch (see strategy.matrix.include),
        # so this exec is native — no qemu emulation, no cross-arch confusion.
        run: ./ttm-linux-${{ matrix.arch }} --help

      - name: Upload ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        uses: actions/upload-artifact@v4
        with:
          name: ttm-linux-${{ matrix.arch }}
          path: ttm-linux-${{ matrix.arch }}
          retention-days: 7

  # No need for environment-scoped secret, hence no `environment:`, unlike the
  # terrat jobs; because this job publishes to this repo's package (not terrateamio).
  build-stategraph:
    needs: set-version-tag
    if: ${{ !cancelled() && (needs.set-version-tag.result == 'success' || github.ref_type == 'tag') }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            # This cache is read by the PR workflow too
            runs-on: ubuntu-22.04
            cache-scope: stategraph-server-oss
          - arch: arm64
            runs-on: ubuntu-22.04-arm
            cache-scope: stategraph-server-oss-arm64

    env:
      VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.set-version-tag.outputs.version_tag }}
      IMAGE: ghcr.io/stategraph/stategraph-server-oss:${{ github.ref_type == 'tag' && github.ref_name || needs.set-version-tag.outputs.version_tag }}-${{ matrix.arch }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set the release version in source
        if: github.ref_type == 'tag'
        run: |
          echo "${VERSION_TAG}" > code/src/sg_version/data/version.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Key is the ISO week (e.g. 2026-W45), so it changes every Monday (UTC) and packages are at most a week old.
      - name: Set the OS refresh key
        run: |
          echo "OS_REFRESH=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      - name: Build and push stategraph-server-oss (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stategraph/Dockerfile
          target: stategraph-server-oss
          push: true
          build-args: |
            UID=1000
            GID=1000
            USERNAME=stategraph
            DEPLOYMENT_KIND=production
            OS_REFRESH=${{ env.OS_REFRESH }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
          tags: ${{ env.IMAGE }}

      # Runner arch matches matrix.arch, so this runs natively.
      - name: Smoke-test the server binary (${{ matrix.arch }})
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          version=$(docker run --rm --entrypoint /usr/local/bin/stategraph-server "$IMAGE" version)
          echo "${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${version}" != "${VERSION_TAG}" ]]; then
            echo "The server reports ${version}, not the release ${VERSION_TAG}" >&2
            exit 1
          fi

  # The FIPS image is built from docker/terrat/Dockerfile.fips, which carries no
  # prebuilt base image, so this job compiles OpenSSL and the opam switch
  # itself. No other job takes it as a dependency: the manifest and the release
  # notes must not wait for it.
  build-fips:
    needs: set-version-tag
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 240

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      IMAGE: ghcr.io/terrateamio/terrat-ee-fips:${{ needs.set-version-tag.outputs.version_tag }}
      LATEST_IMAGE: ghcr.io/terrateamio/terrat-ee-fips:latest
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The `latest` tag moves under the same three conditions as
      # scripts/create_manifest applies to the multi-arch images.
      - name: Build the tag list
        id: tags
        run: |
          set -euo pipefail
          tags=("${IMAGE}")
          if [[ "$(./scripts/is_latest_version_tag)" == "true" &&
                "${GITHUB_REF}" == "refs/heads/main" &&
                "${TERRATEAM_ENVIRONMENT}" == "production" ]]; then
              tags+=("${LATEST_IMAGE}")
          fi
          {
              echo 'tags<<TAGS_EOF'
              printf '%s\n' "${tags[@]}"
              echo 'TAGS_EOF'
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${tags[@]}"

      - name: Build and push terrat-ee-fips (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/terrat/Dockerfile.fips
          target: terrat-ee-fips
          push: true
          provenance: false
          cache-from: type=gha,scope=terrat-fips
          cache-to: type=gha,mode=max,scope=terrat-fips
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify the shipped binary was built from this commit
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c "strings /usr/local/bin/terrat | grep -qF \"$BUILD_SHA\"" \
            || { echo 'Binary does not contain the release SHA: stale or hybrid build'; exit 1; }

      - name: Verify the image runs on the FIPS provider
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            openssl list -providers > /tmp/providers.txt
            for p in fips base default; do
              grep -A3 -E "^ *${p}\$" /tmp/providers.txt | grep -q "status: active" \
                || { echo "the $p provider is not active" >&2; exit 1; }
            done
            if echo fips | openssl dgst -md5 >/dev/null 2>&1; then
              echo "MD5 is reachable: the FIPS properties are not in force" >&2
              exit 1
            fi
          '

      - name: Verify terrat links only the FIPS OpenSSL
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            LD_TRACE_LOADED_OBJECTS=1 /usr/local/bin/terrat > /tmp/ldd.txt
            cat /tmp/ldd.txt
            for lib in libcrypto.so.3 libssl.so.3 libtls.so; do
              if grep -q "$lib" /tmp/ldd.txt && ! grep "$lib" /tmp/ldd.txt | grep -q "/usr/local/ssl/lib/"; then
                echo "$lib resolves outside /usr/local/ssl" >&2
                exit 1
              fi
            done
            if grep -q "not found" /tmp/ldd.txt; then
              echo "unresolved shared library" >&2
              exit 1
            fi
          '

  create-multi-arch-manifest:
    needs: [set-version-tag, build, build-stategraph]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}

    # packages: write lets GITHUB_TOKEN push the stategraph-org manifest.
    permissions:
      contents: read
      packages: write

    outputs:
      is_latest_version_tag: ${{ steps.is-latest-version-tag.outputs.is_latest_version_tag }}

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      GITHUB_REF: ${{ github.ref }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set is latest version tag
        id: is-latest-version-tag
        run: |
          is_latest_version_tag="$(./scripts/is_latest_version_tag)"
          echo "IS_LATEST_VERSION_TAG=${is_latest_version_tag}" >> "${GITHUB_ENV}"
          echo "is_latest_version_tag=${is_latest_version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          ./scripts/create_manifest terrat-ee terrat-oss ttm

      # The stategraph org takes this repository's GITHUB_TOKEN, not the terrateamio
      # token. This login replaces the one above for ghcr.io, hence it comes last.
      - name: Log in to GitHub Container Registry (stategraph)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` of stategraph-server-oss follows the semver releases only:
      # publish-stategraph-release moves it.
      - name: Create and push multi-arch manifest (stategraph)
        run: |
          IS_LATEST_VERSION_TAG=false ./scripts/create_manifest --org stategraph stategraph-server-oss

  # Runs after both builds and their checks, so an image that fails them
  # carries no signature. The version tag and `latest` share a digest, so
  # both verify.
  sign-images:
    needs: [set-version-tag, create-multi-arch-manifest, build-fips]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}

    strategy:
      fail-fast: false
      matrix:
        image: [terrat-ee, terrat-ee-fips]

    permissions:
      contents: read
      # cosign exchanges this token for a Fulcio signing certificate.
      id-token: write

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      IMAGE_REF: ghcr.io/terrateamio/${{ matrix.image }}

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1

      # A multi-arch index and every platform manifest under it get a
      # signature, and each platform manifest gets its own SBOM attestation.
      # A single-platform image is its own platform manifest.
      - name: Sign ${{ matrix.image }} and attest its SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          # Package-to-file relationships make up most of the SPDX document;
          # without them the envelope stays well under Rekor v2's 4 MB request
          # limit.
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}:${VERSION_TAG}" --format '{{json .Manifest}}' > "${RUNNER_TEMP}/manifest.json"
          DIGEST=$(jq -r .digest "${RUNNER_TEMP}/manifest.json")
          cosign sign --yes --recursive "${IMAGE_REF}@${DIGEST}"
          PLATFORMS=$(jq -r '.manifests[]?.digest' "${RUNNER_TEMP}/manifest.json")
          for REF in ${PLATFORMS:-${DIGEST}}; do
            "${SYFT}" scan "registry:${IMAGE_REF}@${REF}" -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"
            cosign attest --yes --type spdxjson \
              --predicate "${RUNNER_TEMP}/sbom.spdx.json" "${IMAGE_REF}@${REF}"
          done

  publish-stategraph-release:
    needs: build-stategraph
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write
      # cosign exchanges this token for a Fulcio signing certificate.
      id-token: write

    env:
      VERSION_TAG: ${{ github.ref_name }}
      IMAGE_REF: ghcr.io/stategraph/stategraph-server-oss

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REF}:${VERSION_TAG}" \
            "${IMAGE_REF}:${VERSION_TAG}-amd64" \
            "${IMAGE_REF}:${VERSION_TAG}-arm64"

      # Only the highest release moves `latest`, so a patch to an older line
      # does not take it back.
      - name: Move latest
        run: |
          set -euo pipefail
          highest=$(git ls-remote --tags origin \
            | sed -nE 's#.*refs/tags/([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' \
            | sort -V | tail -n1)
          if [[ "${highest}" == "${VERSION_TAG}" ]]; then
            docker buildx imagetools create --tag "${IMAGE_REF}:latest" "${IMAGE_REF}:${VERSION_TAG}"
          else
            echo "${VERSION_TAG} is not the highest release (${highest}); latest stays"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1

      - name: Sign stategraph-server-oss and attest its SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          # Package-to-file relationships make up most of the SPDX document;
          # without them the envelope stays well under Rekor v2's 4 MB request
          # limit.
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}:${VERSION_TAG}" --format '{{json .Manifest}}' > "${RUNNER_TEMP}/manifest.json"
          DIGEST=$(jq -r .digest "${RUNNER_TEMP}/manifest.json")
          cosign sign --yes --recursive "${IMAGE_REF}@${DIGEST}"
          for REF in $(jq -r '.manifests[].digest' "${RUNNER_TEMP}/manifest.json"); do
            "${SYFT}" scan "registry:${IMAGE_REF}@${REF}" -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"
            cosign attest --yes --type spdxjson \
              --predicate "${RUNNER_TEMP}/sbom.spdx.json" "${IMAGE_REF}@${REF}"
          done

  release-notify:
    needs: [set-version-tag, create-multi-arch-manifest]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: write

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Download ttm binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: ttm-linux-amd64
          path: ./binaries

      - name: Download ttm binary (arm64)
        uses: actions/download-artifact@v4
        with:
          name: ttm-linux-arm64
          path: ./binaries

      - name: Create release
        run: |
          ./scripts/create_release

      - name: Upload ttm binaries to release
        run: |
          ./scripts/upload_release_assets ./binaries/ttm-linux-*

      - name: Notify Slack
        run: |
          ./scripts/notify_slack
