name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'rfds/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging

jobs:
  # Gate for the whole pipeline. Every push to main cuts a release, and a release that carries
  # nothing user-facing is just noise in the feed people subscribe to. When every PR since the
  # last release is labelled `no-release`, this job stops here.
  release-gate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read

    outputs:
      release: ${{ steps.release-gate.outputs.release }}

    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags: the gate walks main back to the previous release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to release
        id: release-gate
        run: |
          ./scripts/release_gate

  set-version-tag:
    needs: release-gate
    if: needs.release-gate.outputs.release == 'true'
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: write

    outputs:
      version_tag: ${{ steps.set-version-tag.outputs.version_tag }}

    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version tag
        id: set-version-tag
        run: |
          VERSION_TAG=$(./scripts/version_tag)
          echo "VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"
          echo "version_tag=${VERSION_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create tag
        run: |
          ./scripts/create_tag

  build:
    needs: set-version-tag
    runs-on: ${{ matrix.runs-on }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    strategy:
      matrix:
        target: [code-indexer, terrat-ee, terrat-oss, ttm]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
          - arch: arm64
            runs-on: ubuntu-22.04-arm

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERRAT_UI_ANALYTICS: ${{ github.event.inputs.environment == 'production' && vars.TERRATEAM_POSTHOG_TOKEN || 'false' }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      MATRIX_TARGET: ${{ matrix.target }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Set base image
        run: |
          ./scripts/base_image >> $GITHUB_ENV

      - name: Build and push ${{ matrix.target }} (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/terrat/Dockerfile
          push: true
          target: ${{ matrix.target }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/terrateamio/${{ matrix.target }}:${{ env.VERSION_TAG }}-${{ matrix.arch }}

      - name: Verify the shipped binary was built from this commit
        if: matrix.target == 'terrat-oss' || matrix.target == 'terrat-ee'
        env:
          IMAGE: ghcr.io/terrateamio/${{ matrix.target }}:${{ env.VERSION_TAG }}-${{ matrix.arch }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c "strings /usr/local/bin/terrat | grep -qF \"$BUILD_SHA\"" \
            || { echo "Binary does not contain the release SHA: stale or hybrid build"; exit 1; }

      - name: Extract ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        run: |
          docker create --name ttm-extract ghcr.io/terrateamio/ttm:${{ env.VERSION_TAG }}-${{ matrix.arch }}
          docker cp ttm-extract:/usr/local/bin/ttm ./ttm-linux-${{ matrix.arch }}
          docker rm ttm-extract
          chmod +x ./ttm-linux-${{ matrix.arch }}

      - name: Verify ttm binary is statically linked (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        run: |
          if ! file ./ttm-linux-${{ matrix.arch }} | grep -q 'statically linked'; then
              echo "ERROR: ./ttm-linux-${{ matrix.arch }} is not statically linked:" >&2
              file ./ttm-linux-${{ matrix.arch }} >&2
              exit 1
          fi

      - name: Smoke-test ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        # Runner arch matches matrix.arch (see strategy.matrix.include),
        # so this exec is native — no qemu emulation, no cross-arch confusion.
        run: ./ttm-linux-${{ matrix.arch }} --help

      - name: Upload ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        uses: actions/upload-artifact@v4
        with:
          name: ttm-linux-${{ matrix.arch }}
          path: ttm-linux-${{ matrix.arch }}
          retention-days: 7

  # The FIPS image is built from docker/terrat/Dockerfile.fips, which carries no
  # prebuilt base image, so this job compiles OpenSSL and the opam switch
  # itself. No other job takes it as a dependency: the manifest, the release
  # notes and the deploy must not wait for it.
  build-fips:
    needs: set-version-tag
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 240

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      IMAGE: ghcr.io/terrateamio/terrat-ee-fips:${{ needs.set-version-tag.outputs.version_tag }}
      LATEST_IMAGE: ghcr.io/terrateamio/terrat-ee-fips:latest
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The `latest` tag moves under the same three conditions as
      # scripts/create_manifest applies to the multi-arch images.
      - name: Build the tag list
        id: tags
        run: |
          set -euo pipefail
          tags=("${IMAGE}")
          if [[ "$(./scripts/is_latest_version_tag)" == "true" &&
                "${GITHUB_REF}" == "refs/heads/main" &&
                "${TERRATEAM_ENVIRONMENT}" == "production" ]]; then
              tags+=("${LATEST_IMAGE}")
          fi
          {
              echo 'tags<<TAGS_EOF'
              printf '%s\n' "${tags[@]}"
              echo 'TAGS_EOF'
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${tags[@]}"

      - name: Build and push terrat-ee-fips (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/terrat/Dockerfile.fips
          target: terrat-ee-fips
          push: true
          provenance: false
          cache-from: type=gha,scope=terrat-fips
          cache-to: type=gha,mode=max,scope=terrat-fips
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify the shipped binary was built from this commit
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c "strings /usr/local/bin/terrat | grep -qF \"$BUILD_SHA\"" \
            || { echo 'Binary does not contain the release SHA: stale or hybrid build'; exit 1; }

      - name: Verify the image runs on the FIPS provider
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            openssl list -providers > /tmp/providers.txt
            for p in fips base default; do
              grep -A3 -E "^ *${p}\$" /tmp/providers.txt | grep -q "status: active" \
                || { echo "the $p provider is not active" >&2; exit 1; }
            done
            if echo fips | openssl dgst -md5 >/dev/null 2>&1; then
              echo "MD5 is reachable: the FIPS properties are not in force" >&2
              exit 1
            fi
          '

      - name: Verify terrat links only the FIPS OpenSSL
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            LD_TRACE_LOADED_OBJECTS=1 /usr/local/bin/terrat > /tmp/ldd.txt
            cat /tmp/ldd.txt
            for lib in libcrypto.so.3 libssl.so.3 libtls.so; do
              if grep -q "$lib" /tmp/ldd.txt && ! grep "$lib" /tmp/ldd.txt | grep -q "/usr/local/ssl/lib/"; then
                echo "$lib resolves outside /usr/local/ssl" >&2
                exit 1
              fi
            done
            if grep -q "not found" /tmp/ldd.txt; then
              echo "unresolved shared library" >&2
              exit 1
            fi
          '

  create-multi-arch-manifest:
    needs: [set-version-tag, build]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}

    outputs:
      is_latest_version_tag: ${{ steps.is-latest-version-tag.outputs.is_latest_version_tag }}

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      GITHUB_REF: ${{ github.ref }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set is latest version tag
        id: is-latest-version-tag
        run: |
          is_latest_version_tag="$(./scripts/is_latest_version_tag)"
          echo "IS_LATEST_VERSION_TAG=${is_latest_version_tag}" >> "${GITHUB_ENV}"
          echo "is_latest_version_tag=${is_latest_version_tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          ./scripts/create_manifest code-indexer terrat-ee terrat-oss ttm

  release-notify:
    needs: [set-version-tag, create-multi-arch-manifest]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: write

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Download ttm binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: ttm-linux-amd64
          path: ./binaries

      - name: Download ttm binary (arm64)
        uses: actions/download-artifact@v4
        with:
          name: ttm-linux-arm64
          path: ./binaries

      - name: Create release
        run: |
          ./scripts/create_release

      - name: Upload ttm binaries to release
        run: |
          ./scripts/upload_release_assets ./binaries/ttm-linux-*

      - name: Notify Slack
        run: |
          ./scripts/notify_slack

  deploy:
    needs: [set-version-tag, release-notify, create-multi-arch-manifest]
    if: ${{ needs.create-multi-arch-manifest.outputs.is_latest_version_tag == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ github.event.inputs.environment || 'production' }}
      VERSION_TAG: ${{ needs.set-version-tag.outputs.version_tag }}
    secrets: inherit
