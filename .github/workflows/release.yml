name: release

# Dispatched only. The monorepo release dispatches it at the semver tag it puts
# on the export merge commit. Dispatched by hand without semver_tag, it is a terrat-only release.
#
# stategraph-server-oss is tagged by semver. The terrat images (terrat-ee, terrat-oss, ttm,
# terrat-ee-fips) are tagged with the date tag of the commit and, on a semver release, the
# semver tag too.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
      semver_tag:
        description: 'Release under this existing semver tag (e.g. 1.2.3), dispatched at that tag. Leave empty for a terrat-only release'
        required: false
        type: string

jobs:
  set-version-tag:
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: write

    outputs:
      date_tag: ${{ steps.set-version-tag.outputs.date_tag }}
      semver_tag: ${{ steps.set-version-tag.outputs.semver_tag }}
      on_main: ${{ steps.on-main.outputs.on_main }}

    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version tags
        id: set-version-tag
        env:
          SEMVER_TAG: ${{ inputs.semver_tag }}
        run: |
          # The semver tag already exists and this run is at it, so everything below builds
          # the tagged commit.
          if [[ -n "${SEMVER_TAG}" && "${GITHUB_REF}" != "refs/tags/${SEMVER_TAG}" ]]; then
            echo "Error: a semver release must be dispatched at its tag (--ref ${SEMVER_TAG}), not at ${GITHUB_REF}" >&2
            exit 1
          fi
          DATE_TAG=$(./scripts/version_tag)
          echo "date_tag=${DATE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "semver_tag=${SEMVER_TAG}" >> "${GITHUB_OUTPUT}"

      # A release runs at a tag (or any branch), not at main, so check that the released
      # commit is in main's history: main is that commit ("identical") or contains it plus
      # newer commits ("ahead"). Only then may `latest` move.
      - name: Check whether the commit is on main
        id: on-main
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/$(git rev-parse HEAD)...main" --jq '.status')"
          on_main=false
          if [[ "${status}" == "ahead" || "${status}" == "identical" ]]; then
            on_main=true
          fi
          echo "on_main=${on_main}" >> "${GITHUB_OUTPUT}"

      # The date tag is the commit's, so a re-run finds it already there.
      - name: Create date tag
        env:
          VERSION_TAG: ${{ steps.set-version-tag.outputs.date_tag }}
        run: |
          ./scripts/create_tag

  build:
    needs: set-version-tag
    runs-on: ${{ matrix.runs-on }}
    environment: ${{ github.event.inputs.environment || 'production' }}

    strategy:
      matrix:
        target: ${{ fromJSON(needs.set-version-tag.outputs.semver_tag && '["terrat-ee", "terrat-oss", "ttm", "stategraph-server-oss"]' || '["terrat-ee", "terrat-oss", "ttm"]') }}
        arch: [amd64, arm64]
        # The runner arch matches the image arch, so the checks below run the image
        # natively.
        include:
          - arch: amd64
            runs-on: depot-ubuntu-24.04
          - arch: arm64
            runs-on: depot-ubuntu-24.04-arm

    env:
      DATE_TAG: ${{ needs.set-version-tag.outputs.date_tag }}
      SEMVER_TAG: ${{ needs.set-version-tag.outputs.semver_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERRAT_UI_ANALYTICS: ${{ github.event.inputs.environment == 'production' && vars.TERRATEAM_POSTHOG_TOKEN || 'false' }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      MATRIX_TARGET: ${{ matrix.target }}
      MATRIX_ARCH: ${{ matrix.arch }}

    permissions:
      contents: write
      packages: write
      # depot/build-push-action authenticates to Depot over OIDC
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The terrat images go to the terrateamio org, under the date tag and, on a semver
      # release, the semver tag too. stategraph-server-oss goes to this repository's org,
      # under the semver tag. IMAGE is the tag the checks below pull.
      - name: Set the image tags
        id: image
        run: |
          set -euo pipefail
          if [[ "${MATRIX_TARGET}" == "stategraph-server-oss" ]]; then
            image="ghcr.io/stategraph/${MATRIX_TARGET}:${SEMVER_TAG}-${MATRIX_ARCH}"
            tags=("${image}")
          else
            image="ghcr.io/terrateamio/${MATRIX_TARGET}:${DATE_TAG}-${MATRIX_ARCH}"
            tags=("${image}")
            if [[ -n "${SEMVER_TAG}" ]]; then
              tags+=("ghcr.io/terrateamio/${MATRIX_TARGET}:${SEMVER_TAG}-${MATRIX_ARCH}")
            fi
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          {
            echo 'tags<<TAGS_EOF'
            printf '%s\n' "${tags[@]}"
            echo 'TAGS_EOF'
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${tags[@]}"

      - name: Log in to GitHub Container Registry (terrateamio)
        if: matrix.target != 'stategraph-server-oss'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      # The stategraph org takes this repository's GITHUB_TOKEN, not the terrateamio token.
      - name: Log in to GitHub Container Registry (stategraph)
        if: matrix.target == 'stategraph-server-oss'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      # The persistent layer cache would otherwise serve the runtime stages' `apk upgrade`
      # from whenever it last ran. The ISO week (e.g. 2026-W45) as its cache key makes the
      # first release of a week pick up the packages fixed since, and lets the rest of the
      # week's releases reuse the layer, so the packages are at most a week old.
      - name: Set the OS refresh key
        run: |
          echo "OS_REFRESH=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      # provenance: false keeps each image a plain manifest, which scripts/create_manifest
      # merges into the multi-arch one and sign-images walks.
      - name: Build and push ${{ matrix.target }} (${{ matrix.arch }})
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: .
          file: docker/stategraph/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            UID=1000
            GID=1000
            USERNAME=stategraph
            DEPLOYMENT_KIND=production
            OS_REFRESH=${{ env.OS_REFRESH }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Verify the shipped binary was built from this commit
        if: matrix.target == 'terrat-oss' || matrix.target == 'terrat-ee'
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c "strings /usr/local/bin/terrat | grep -qF \"$BUILD_SHA\"" \
            || { echo "Binary does not contain the release SHA: stale or hybrid build"; exit 1; }

      - name: Smoke-test the server binary (${{ matrix.arch }})
        if: matrix.target == 'stategraph-server-oss'
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint /usr/local/bin/stategraph-server "$IMAGE" version

      - name: Extract ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        run: |
          docker pull -q "$IMAGE"
          docker create --name ttm-extract "$IMAGE"
          docker cp ttm-extract:/usr/local/bin/ttm ./ttm-linux-${{ matrix.arch }}
          docker rm ttm-extract
          chmod +x ./ttm-linux-${{ matrix.arch }}

      - name: Verify ttm binary is statically linked (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        run: |
          if ! file ./ttm-linux-${{ matrix.arch }} | grep -q 'statically linked'; then
              echo "ERROR: ./ttm-linux-${{ matrix.arch }} is not statically linked:" >&2
              file ./ttm-linux-${{ matrix.arch }} >&2
              exit 1
          fi

      - name: Smoke-test ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        # Runner arch matches matrix.arch (see strategy.matrix.include),
        # so this exec is native — no qemu emulation, no cross-arch confusion.
        run: ./ttm-linux-${{ matrix.arch }} --help

      - name: Upload ttm binary (${{ matrix.arch }})
        if: matrix.target == 'ttm'
        uses: actions/upload-artifact@v4
        with:
          name: ttm-linux-${{ matrix.arch }}
          path: ttm-linux-${{ matrix.arch }}
          retention-days: 7

  # The FIPS image is built from docker/terrat/Dockerfile.fips, which carries no
  # prebuilt base image, so this job compiles OpenSSL and the opam switch
  # itself. No other job takes it as a dependency: the manifest and the release
  # notes must not wait for it.
  build-fips:
    needs: set-version-tag
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 240

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.date_tag }}
      IMAGE: ghcr.io/terrateamio/terrat-ee-fips:${{ needs.set-version-tag.outputs.date_tag }}
      SEMVER_TAG: ${{ needs.set-version-tag.outputs.semver_tag }}
      SEMVER_IMAGE: ghcr.io/terrateamio/terrat-ee-fips:${{ needs.set-version-tag.outputs.semver_tag }}
      LATEST_IMAGE: ghcr.io/terrateamio/terrat-ee-fips:latest
      ON_MAIN: ${{ needs.set-version-tag.outputs.on_main }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The `latest` tag moves under the same three conditions as
      # scripts/create_manifest applies to the multi-arch images.
      - name: Build the tag list
        id: tags
        run: |
          set -euo pipefail
          tags=("${IMAGE}")
          if [[ -n "${SEMVER_TAG}" ]]; then
              tags+=("${SEMVER_IMAGE}")
          fi
          if [[ "$(./scripts/is_latest_version_tag)" == "true" &&
                "${ON_MAIN}" == "true" &&
                "${TERRATEAM_ENVIRONMENT}" == "production" ]]; then
              tags+=("${LATEST_IMAGE}")
          fi
          {
              echo 'tags<<TAGS_EOF'
              printf '%s\n' "${tags[@]}"
              echo 'TAGS_EOF'
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${tags[@]}"

      - name: Build and push terrat-ee-fips (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/terrat/Dockerfile.fips
          target: terrat-ee-fips
          push: true
          provenance: false
          # A registry cache, not the GHA one: a release runs at its tag, and a GHA cache saved
          # there could only be restored by that same tag.
          cache-from: type=registry,ref=ghcr.io/terrateamio/terrat-ee-fips:buildcache
          cache-to: type=registry,ref=ghcr.io/terrateamio/terrat-ee-fips:buildcache,mode=max,ignore-error=true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

      - name: Verify the shipped binary was built from this commit
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c "strings /usr/local/bin/terrat | grep -qF \"$BUILD_SHA\"" \
            || { echo 'Binary does not contain the release SHA: stale or hybrid build'; exit 1; }

      - name: Verify the image runs on the FIPS provider
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            openssl list -providers > /tmp/providers.txt
            for p in fips base default; do
              grep -A3 -E "^ *${p}\$" /tmp/providers.txt | grep -q "status: active" \
                || { echo "the $p provider is not active" >&2; exit 1; }
            done
            if echo fips | openssl dgst -md5 >/dev/null 2>&1; then
              echo "MD5 is reachable: the FIPS properties are not in force" >&2
              exit 1
            fi
          '

      - name: Verify terrat links only the FIPS OpenSSL
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -eu
            LD_TRACE_LOADED_OBJECTS=1 /usr/local/bin/terrat > /tmp/ldd.txt
            cat /tmp/ldd.txt
            for lib in libcrypto.so.3 libssl.so.3 libtls.so; do
              if grep -q "$lib" /tmp/ldd.txt && ! grep "$lib" /tmp/ldd.txt | grep -q "/usr/local/ssl/lib/"; then
                echo "$lib resolves outside /usr/local/ssl" >&2
                exit 1
              fi
            done
            if grep -q "not found" /tmp/ldd.txt; then
              echo "unresolved shared library" >&2
              exit 1
            fi
          '

  create-multi-arch-manifest:
    needs: [set-version-tag, build]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}

    # packages: write lets GITHUB_TOKEN push the stategraph-org manifest.
    permissions:
      contents: read
      packages: write

    env:
      # Only a commit on main moves `latest`
      PUSH_LATEST: ${{ needs.set-version-tag.outputs.on_main }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      # Under the date tag, then the semver tag. Both are built from the same per-arch images,
      # so they share a digest. Only the date tag decides `latest`.
      - name: Create and push multi-arch manifest
        env:
          VERSION_TAG: ${{ needs.set-version-tag.outputs.date_tag }}
          SEMVER_TAG: ${{ needs.set-version-tag.outputs.semver_tag }}
        run: |
          IS_LATEST_VERSION_TAG="$(./scripts/is_latest_version_tag)"
          export IS_LATEST_VERSION_TAG
          ./scripts/create_manifest terrat-ee terrat-oss ttm
          if [[ -n "${SEMVER_TAG}" ]]; then
            VERSION_TAG="${SEMVER_TAG}" IS_LATEST_VERSION_TAG=false \
              ./scripts/create_manifest terrat-ee terrat-oss ttm
          fi

      # The stategraph org takes this repository's GITHUB_TOKEN, not the terrateamio
      # token. This login replaces the one above for ghcr.io, hence it comes last.
      - name: Log in to GitHub Container Registry (stategraph)
        if: needs.set-version-tag.outputs.semver_tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (stategraph)
        if: needs.set-version-tag.outputs.semver_tag != ''
        env:
          VERSION_TAG: ${{ needs.set-version-tag.outputs.semver_tag }}
        run: |
          IS_LATEST_VERSION_TAG="$(./scripts/is_latest_version_tag)"
          export IS_LATEST_VERSION_TAG
          ./scripts/create_manifest --org stategraph stategraph-server-oss

  # Runs after both builds and their checks, so an image that fails them
  # carries no signature. The date tag, the semver tag and `latest` share a
  # digest, so all of them verify.
  sign-images:
    needs: [set-version-tag, create-multi-arch-manifest, build-fips]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}

    strategy:
      fail-fast: false
      matrix:
        image: [terrat-ee, terrat-ee-fips]

    permissions:
      contents: read
      # cosign exchanges this token for a Fulcio signing certificate.
      id-token: write

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.date_tag }}
      IMAGE_REF: ghcr.io/terrateamio/${{ matrix.image }}

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1

      # A multi-arch index and every platform manifest under it get a
      # signature, and each platform manifest gets its own SBOM attestation.
      # A single-platform image is its own platform manifest.
      - name: Sign ${{ matrix.image }} and attest its SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          # Package-to-file relationships make up most of the SPDX document;
          # without them the envelope stays well under Rekor v2's 4 MB request
          # limit.
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}:${VERSION_TAG}" --format '{{json .Manifest}}' > "${RUNNER_TEMP}/manifest.json"
          DIGEST=$(jq -r .digest "${RUNNER_TEMP}/manifest.json")
          cosign sign --yes --recursive "${IMAGE_REF}@${DIGEST}"
          PLATFORMS=$(jq -r '.manifests[]?.digest' "${RUNNER_TEMP}/manifest.json")
          for REF in ${PLATFORMS:-${DIGEST}}; do
            "${SYFT}" scan "registry:${IMAGE_REF}@${REF}" -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"
            cosign attest --yes --type spdxjson \
              --predicate "${RUNNER_TEMP}/sbom.spdx.json" "${IMAGE_REF}@${REF}"
          done

  # One GitHub release per run: under the semver tag, or under the date tag for a terrat-only release.
  release-notify:
    needs: [set-version-tag, create-multi-arch-manifest]
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: write

    env:
      VERSION_TAG: ${{ needs.set-version-tag.outputs.semver_tag || needs.set-version-tag.outputs.date_tag }}
      TERRAT_IMAGE_TAG: ${{ needs.set-version-tag.outputs.date_tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TERRATEAM_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ttm binary (amd64)
        uses: actions/download-artifact@v4
        with:
          name: ttm-linux-amd64
          path: ./binaries

      - name: Download ttm binary (arm64)
        uses: actions/download-artifact@v4
        with:
          name: ttm-linux-arm64
          path: ./binaries

      - name: Create release
        run: |
          ./scripts/create_release

      - name: Upload ttm binaries to release
        run: |
          ./scripts/upload_release_assets ./binaries/ttm-linux-*

      - name: Notify Slack
        run: |
          ./scripts/notify_slack
