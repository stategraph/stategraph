name: stategraph

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  build-server-oss:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      # depot/build-push-action authenticates to Depot over OIDC
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      # Key is the ISO week, so the cached `apk upgrade` layer is at most a week old.
      - name: Set the OS refresh key
        run: |
          echo "OS_REFRESH=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      # Keep the build-args in sync with the build-stategraph job in release.yml,
      # which publishes this image. Built on Depot's builders, in the repository's
      # own Depot project, whose layer cache persists across runs.
      - name: Build the OSS server image
        uses: depot/build-push-action@v1
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          context: .
          file: docker/stategraph/Dockerfile
          target: stategraph-server-oss
          build-args: |
            UID=1000
            GID=1000
            USERNAME=stategraph
            DEPLOYMENT_KIND=production
            OS_REFRESH=${{ env.OS_REFRESH }}
          push: false
