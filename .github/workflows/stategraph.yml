name: stategraph

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  build-server-oss:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The default docker driver cannot export to the GHA cache.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Key is the ISO week, so a cached `apk upgrade` layer is at most a week old.
      - name: Set the OS refresh key
        run: |
          echo "OS_REFRESH=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      # Keep the build-args in sync with the build-stategraph job in release.yml,
      # which publishes this image. The cache read here is this PR's own: releases
      # keep no cache (see release.yml).
      - name: Build the OSS server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stategraph/Dockerfile
          target: stategraph-server-oss
          build-args: |
            UID=1000
            GID=1000
            USERNAME=stategraph
            DEPLOYMENT_KIND=production
            OS_REFRESH=${{ env.OS_REFRESH }}
          cache-from: type=gha,scope=stategraph-server-oss
          cache-to: type=gha,mode=max,scope=stategraph-server-oss
          push: false
