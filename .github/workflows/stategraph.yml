name: stategraph

on:
  workflow_dispatch:

jobs:
  build-server-oss:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the OSS server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stategraph/Dockerfile
          target: stategraph-server-oss
          build-args: |
            UID=1000
            GID=1000
            USERNAME=stategraph
            DEPLOYMENT_KIND=production
          push: false
