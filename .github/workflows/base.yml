name: base

# ghcr.io/terrateamio/terrat-base at the tag that scripts/base_image derives
# from the inputs of the build-base stage of docker/terrat/Dockerfile. The
# build runs only when that tag is not on the registry.
on:
  workflow_call:
    outputs:
      base_image:
        description: The image, as scripts/base_image prints it
        value: ${{ jobs.tag.outputs.base_image }}
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-22.04
    outputs:
      base_image: ${{ steps.tag.outputs.base_image }}
      base_image_tag: ${{ steps.tag.outputs.base_image_tag }}
      exists: ${{ steps.exists.outputs.exists }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive the tag from the inputs of the build-base stage
        id: tag
        run: |
          eval "$(./scripts/base_image)"
          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "base_image_tag=${BASE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Look for the image on the registry
        id: exists
        env:
          BASE_IMAGE: ${{ steps.tag.outputs.base_image }}
        run: |
          if docker manifest inspect "${BASE_IMAGE}" > /dev/null; then
            echo "${BASE_IMAGE} exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "${BASE_IMAGE} is missing: building it."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.exists == 'false'
    runs-on: ${{ matrix.runs-on }}
    environment: production

    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-22.04
          - arch: arm64
            runs-on: ubuntu-22.04-arm

    permissions:
      contents: read
      packages: write

    env:
      VERSION_TAG: ${{ needs.tag.outputs.base_image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/terrat/Dockerfile
          push: true
          target: build-base
          tags: |
            ghcr.io/terrateamio/terrat-base:${{ env.VERSION_TAG }}-${{ matrix.arch }}

  create-manifest:
    needs: [tag, build]
    if: needs.tag.outputs.exists == 'false'
    runs-on: ubuntu-22.04
    environment: production

    permissions:
      contents: read
      packages: write

    env:
      VERSION_TAG: ${{ needs.tag.outputs.base_image_tag }}
      GITHUB_REF: ${{ github.ref }}
      TERRATEAM_ENVIRONMENT: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: x-access-token
          password: ${{ secrets.TERRATEAMIO_PACKAGES_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          ./scripts/create_manifest terrat-base
